[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jokerps5"
version = "0.1.0"
description = "Python client for Joker PS5 Control"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "pillow",
]

[project.optional-dependencies]
jxr = ["imagecodecs"]
dev = ["pytest"]

[project.scripts]
jokerps5 = "jokerps5.cli:main"
jokerps5-mcp = "jokerps5.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jokerps5"]
